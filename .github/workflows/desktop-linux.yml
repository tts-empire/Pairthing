name: Desktop Linux
on: workflow_dispatch
permissions:
  contents: read
jobs:
  flatpak:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y flatpak xvfb xdotool dbus-x11
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          npm ci && npm run build
          python -m pip install -r scripts/pairing/requirements.txt pyinstaller==6.22.3
      - name: Build inside GNOME SDK
        run: bash packaging/flatpak/build.sh
      - name: Install bundle and exercise window
        run: |
          flatpak install --user -y ./Pairthing-$(uname -m).flatpak
          dbus-run-session -- xvfb-run -a bash packaging/flatpak/check-window.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Pairthing-${{ matrix.runner }}
          path: '*.flatpak'
